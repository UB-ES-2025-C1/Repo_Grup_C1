name: Auto-approve PR

on:
  pull_request:
    branches: [ pre-prod, main ]
    types: [opened, synchronize, reopened]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # S'executa si el PR és de develop a pre-prod O de pre-prod a main
    if: |
      (github.event.pull_request.base.ref == 'pre-prod' && github.event.pull_request.head.ref == 'develop') ||
      (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'pre-prod')
    permissions:
      pull-requests: write
      contents: read
      checks: read

    steps:
      - name: Wait for status checks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const maxWait = 600000; // 10 minuts màxim
            const checkInterval = 15000; // Comprova cada 15 segons
            const startTime = Date.now();
            
            console.log(`Esperant que els tests acabin per al commit ${sha}...`);
            
            while (Date.now() - startTime < maxWait) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
              });
              
              // Filtra el check del propi workflow (auto-approve)
              const otherChecks = checks.check_runs.filter(
                check => !check.name.includes('auto-approve') && 
                         !check.name.includes('Auto-approve')
              );
              
              console.log(`Trobats ${checks.check_runs.length} checks totals, ${otherChecks.length} checks a esperar (excloent auto-approve):`);
              otherChecks.forEach(check => {
                console.log(`  - ${check.name}: ${check.status} (${check.conclusion || 'pending'})`);
              });
              
              // Comprova si tots els checks han acabat
              const allCompleted = otherChecks.every(
                check => check.status === 'completed'
              );
              
              if (allCompleted && otherChecks.length > 0) {
                // Comprova si tots han passat
                const allPassed = otherChecks.every(
                  check => check.conclusion === 'success'
                );
                
                if (allPassed) {
                  console.log(`✅ Tots els ${otherChecks.length} checks han passat correctament!`);
                  return;
                } else {
                  // Alguns checks han fallat
                  const failedChecks = otherChecks.filter(
                    check => check.conclusion !== 'success'
                  );
                  console.log(`❌ Alguns checks han fallat:`);
                  failedChecks.forEach(check => {
                    console.log(`  - ${check.name}: ${check.conclusion}`);
                  });
                  throw new Error(`❌ ${failedChecks.length} check(s) han fallat. No es pot aprovar el PR.`);
                }
              } else if (otherChecks.length === 0) {
                console.log('⚠️ No s\'han trobat altres checks. Esperant...');
              } else {
                const pendingCount = otherChecks.filter(
                  check => check.status !== 'completed'
                ).length;
                console.log(`⏳ Esperant que ${pendingCount} check(s) acabin...`);
              }
              
              await new Promise(resolve => setTimeout(resolve, checkInterval));
            }
            
            throw new Error('Timeout: Els tests no han acabat en el temps esperat.');

      - name: Auto-approve PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            
            // Comprova si ja hi ha una aprovació
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: number,
            });
            
            const hasApproval = reviews.some(
              review => review.state === 'APPROVED'
            );
            
            if (!hasApproval) {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: number,
                event: 'APPROVE',
                body: '✅ Auto-aprovat: Tots els tests han passat correctament.'
              });
              console.log('PR auto-aprovat!');
            } else {
              console.log('El PR ja té una aprovació.');
            }

