services:
  backend:
    container_name: ${CONTAINER_NAME_BACKEND:-cinemaub-prod-backend}
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Assegura que Django veu host i CSRF des del .env
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-cinemaub.settings}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend/media:/app/media
      - ./backend/db.sqlite3:/app/db.sqlite3
    expose:
      - "8000"
    networks:
      web:
        aliases:
          # Alias ÚNIC per aquest stack
          - ${CONTAINER_NAME_BACKEND:-cinemaub-prod-backend}
    depends_on:
      - redis
    restart: unless-stopped

  sse:
    container_name: ${CONTAINER_NAME_SSE:-cinemaub-prod-sse}
    build:
      context: ./sse   # Carpeta donde está tu servidor SSE
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    networks:
      web:
        aliases:
          # Alias ÚNIC per aquest stack
          - ${CONTAINER_NAME_SSE:-cinemaub-prod-sse}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis
    container_name: ${CONTAINER_NAME_REDIS:-cinemaub-prod-redis}
    ports:
      - "6379:6379"
    networks:
      web:
        aliases:
          # Alias ÚNIC per aquest stack
          - ${CONTAINER_NAME_REDIS:-cinemaub-prod-redis}
    restart: unless-stopped

networks:
  web:
    external: true