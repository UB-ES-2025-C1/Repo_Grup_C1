version: "3.8"

services:
  cinemaub-backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      # - ./static:/app/static    # si algun dia gestiones estàtics fora de Whitenoise
      - ./db.sqlite3:/app/db.sqlite3  # persistir el teu SQLite
    expose:
      - "8000"
    networks:
      web:
        aliases:
          - cinemaub-backend
    restart: unless-stopped

networks:
  web:
    external: true